# Publishes to npm. When changesets land on main this opens a "Version packages" pull request;
# merging that pull request publishes the new versions.
#
# Publishing uses npm trusted publishing: npm trusts this repository and this workflow file
# directly, so no npm token is stored anywhere. Each package lists this workflow as its trusted
# publisher in its settings on npmjs.com. Renaming this file breaks that link.
name: Release
on:
  push:
    branches: [main]
concurrency: release
permissions:
  contents: write
  pull-requests: write
  # Lets the job prove to npm which repository and workflow it is.
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs npm 11.5 or newer, which comes with Node.js 24.
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - uses: changesets/action@v2
        with:
          version-script: pnpm changeset version
          publish-script: pnpm release
          create-github-releases: true
